<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  getDocs,
  deleteDoc,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/* =========================
   Firebase
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyBhfOVk4K5Ybjji16b1ZKRqXd1UJGypH9Y",
  authDomain: "sleep-sensor-af01f.firebaseapp.com",
  projectId: "sleep-sensor-af01f",
  storageBucket: "sleep-sensor-af01f.firebasestorage.app",
  messagingSenderId: "86707291255",
  appId: "1:86707291255:web:01e2e67fa63c3513503272"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);

let currentUser = null;


/* =========================
   Firebase Status
========================= */

function setFirebaseStatus(text, type = "") {
  const element = document.getElementById("firebaseStatus");

  element.textContent = text;
  element.className = "status";

  if (type) {
    element.classList.add(type);
  }
}


/* =========================
   Wake Lock
========================= */

let wakeLock = null;

async function requestWakeLock() {

  if (!("wakeLock" in navigator)) {
    console.log("Wake Lock APIはこの端末・ブラウザでは利用できません");
    return;
  }

  try {

    wakeLock = await navigator.wakeLock.request("screen");

    console.log("画面自動消灯防止：ON");

    wakeLock.addEventListener("release", () => {
      console.log("画面自動消灯防止：OFF");
    });

  } catch (error) {

    console.warn("Wake Lock取得失敗:", error);

  }
}


async function releaseWakeLock() {

  if (wakeLock) {

    try {
      await wakeLock.release();
    } catch (error) {
      console.warn("Wake Lock解除エラー:", error);
    }

    wakeLock = null;
  }
}


/*
   スマホで別アプリなどに移動してWake Lockが解除された場合、
   アプリへ戻ってきたときに測定中なら再取得する。
*/

document.addEventListener("visibilitychange", async () => {

  if (
    document.visibilityState === "visible" &&
    isMeasuring
  ) {
    await requestWakeLock();
  }

});


/* =========================
   Authentication
========================= */

async function initializeAuthentication() {

  try {

    setFirebaseStatus("Firebase匿名認証中...");

    await signInAnonymously(auth);

    currentUser = auth.currentUser;

    if (!currentUser) {
      throw new Error("Firebaseユーザーを取得できませんでした");
    }

    console.log("Firebase認証成功");
    console.log("UID:", currentUser.uid);

    setFirebaseStatus(
      "Firebase認証済み",
      "ok"
    );

    await loadFromFirestore();

    renderDashboard();

  } catch (error) {

    console.error("Firebase認証エラー:", error);

    console.error("Firebase認証エラー詳細:", {
      code: error.code,
      message: error.message,
      name: error.name
    });

    setFirebaseStatus(
      "Firebase認証エラー: " + error.message,
      "error"
    );

  }

}


/* =========================
   Data
========================= */

let measurements = [];

let profile = {
  xp: 0,
  currentStreak: 0,
  bestStreak: 0,
  totalDays: 0,
  lastMeasurementDate: null
};


/* =========================
   Measurement variables
========================= */

let isMeasuring = false;
let measurementStartTime = null;
let timerInterval = null;

let motionHistory = [];
let volumeHistory = [];

let currentMotion = 0;
let currentVolume = 0;

let stillCount = 0;
let smallCount = 0;
let largeCount = 0;

let sampleCount = 0;

let measurementData = [];

let audioContext = null;
let analyser = null;
let microphone = null;
let audioDataArray = null;

let motionHandler = null;


/* =========================
   Utility
========================= */

function todayString() {

  const now = new Date();

  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");

  return `${y}-${m}-${d}`;
}


function formatDuration(seconds) {

  seconds = Math.max(0, Math.floor(seconds));

  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;

  return [
    String(h).padStart(2, "0"),
    String(m).padStart(2, "0"),
    String(s).padStart(2, "0")
  ].join(":");
}


/* =========================
   Device Motion
========================= */

function calculateMotion(event) {

  const acc =
    event.accelerationIncludingGravity;

  if (!acc) return 0;

  const x = acc.x || 0;
  const y = acc.y || 0;
  const z = acc.z || 0;

  return Math.sqrt(
    x * x +
    y * y +
    z * z
  );
}


function handleMotion(event) {

  if (!isMeasuring) return;

  currentMotion = calculateMotion(event);

  motionHistory.push({
    time: Date.now(),
    value: currentMotion
  });

  if (motionHistory.length > 300) {
    motionHistory.shift();
  }

  updateDisplay();
}


/* =========================
   Microphone
========================= */

async function startMicrophone() {

  const stream =
    await navigator.mediaDevices.getUserMedia({
      audio: true
    });

  audioContext =
    new (window.AudioContext ||
      window.webkitAudioContext)();

  analyser =
    audioContext.createAnalyser();

  analyser.fftSize = 256;

  microphone =
    audioContext.createMediaStreamSource(stream);

  microphone.connect(analyser);

  audioDataArray =
    new Uint8Array(
      analyser.fftSize
    );

  readVolume();

  return stream;
}


function readVolume() {

  if (!isMeasuring || !analyser) return;

  analyser.getByteTimeDomainData(
    audioDataArray
  );

  let sum = 0;

  for (let i = 0; i < audioDataArray.length; i++) {

    const value =
      (audioDataArray[i] - 128) / 128;

    sum += value * value;

  }

  currentVolume =
    Math.sqrt(
      sum / audioDataArray.length
    );

  volumeHistory.push({
    time: Date.now(),
    value: currentVolume
  });

  if (volumeHistory.length > 300) {
    volumeHistory.shift();
  }

  updateDisplay();

  requestAnimationFrame(readVolume);
}


/* =========================
   Measurement
========================= */

async function startMeasurement() {

  if (isMeasuring) return;

  try {

    /*
       画面自動消灯防止
    */

    await requestWakeLock();

    if (
      typeof DeviceMotionEvent !== "undefined" &&
      typeof DeviceMotionEvent.requestPermission === "function"
    ) {

      const permission =
        await DeviceMotionEvent.requestPermission();

      if (permission !== "granted") {
        throw new Error(
          "加速度センサーの使用が許可されませんでした"
        );
      }

    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      throw new Error(
        "このブラウザではマイクを利用できません"
      );

    }

    await startMicrophone();

    isMeasuring = true;

    measurementStartTime = Date.now();

    motionHistory = [];
    volumeHistory = [];
    measurementData = [];

    stillCount = 0;
    smallCount = 0;
    largeCount = 0;
    sampleCount = 0;

    currentMotion = 0;
    currentVolume = 0;

    motionHandler = handleMotion;

    window.addEventListener(
      "devicemotion",
      motionHandler
    );

    document.getElementById(
      "startButton"
    ).disabled = true;

    document.getElementById(
      "stopButton"
    ).disabled = false;

    document.getElementById(
      "sensorStatus"
    ).textContent =
      "測定中です。スマホを寝る場所の近くに置いてください。";

    document.getElementById(
      "sensorStatus"
    ).className = "status ok";

    timerInterval = setInterval(
      updateTimer,
      1000
    );

    updateTimer();

    /*
       10秒ごとにデータを集計
    */

    measurementInterval = setInterval(
      summarize10Seconds,
      10000
    );

  } catch (error) {

    console.error(
      "測定開始エラー:",
      error
    );

    await releaseWakeLock();

    document.getElementById(
      "sensorStatus"
    ).textContent =
      "測定開始エラー: " +
      error.message;

    document.getElementById(
      "sensorStatus"
    ).className =
      "status error";

  }

}


let measurementInterval = null;


function summarize10Seconds() {

  if (!isMeasuring) return;

  const recentMotion =
    motionHistory.slice(-100);

  let averageMotion = 0;

  if (recentMotion.length > 0) {

    averageMotion =
      recentMotion.reduce(
        (sum, item) => sum + item.value,
        0
      ) / recentMotion.length;

  }

  const averageVolume =
    volumeHistory.length > 0
      ? volumeHistory
          .slice(-100)
          .reduce(
            (sum, item) => sum + item.value,
            0
          ) / Math.min(100, volumeHistory.length)
      : 0;

  let state = "静止";

  /*
     加速度の変化量を簡易的に判定。
     端末によって値が異なるため、
     実験後に閾値を調整する。
  */

  if (averageMotion < 9.85) {

    stillCount++;
    state = "静止";

  } else if (averageMotion < 10.5) {

    smallCount++;
    state = "小さな動き";

  } else {

    largeCount++;
    state = "大きな動き";

  }

  sampleCount++;

  measurementData.push({
    time: new Date().toISOString(),
    motion: averageMotion,
    volume: averageVolume,
    state: state
  });

  document.getElementById(
    "currentState"
  ).textContent = state;

  document.getElementById(
    "sampleCount"
  ).textContent = sampleCount;

  drawGraph();

}


/* =========================
   Timer
========================= */

function updateTimer() {

  if (!measurementStartTime) return;

  const elapsed =
    Math.floor(
      (Date.now() - measurementStartTime) /
      1000
    );

  document.getElementById(
    "measurementTimer"
  ).textContent =
    formatDuration(elapsed);

}


/* =========================
   Display
========================= */

function updateDisplay() {

  document.getElementById(
    "motionValue"
  ).textContent =
    currentMotion.toFixed(2);

  document.getElementById(
    "volumeValue"
  ).textContent =
    currentVolume.toFixed(4);

  drawGraph();

}


/* =========================
   Graph
========================= */

function drawGraph() {

  const canvas =
    document.getElementById("graph");

  const ctx =
    canvas.getContext("2d");

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    rect.width * dpr;

  canvas.height =
    rect.height * dpr;

  ctx.scale(dpr, dpr);

  const width = rect.width;
  const height = rect.height;

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  ctx.strokeStyle = "#ddd";
  ctx.lineWidth = 1;

  for (let i = 0; i <= 5; i++) {

    const y =
      (height / 5) * i;

    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();

  }

  const data =
    motionHistory.slice(-100);

  if (data.length < 2) return;

  let min =
    Math.min(
      ...data.map(d => d.value)
    );

  let max =
    Math.max(
      ...data.map(d => d.value)
    );

  if (max - min < 0.01) {
    max = min + 1;
  }

  ctx.beginPath();

  data.forEach((item, index) => {

    const x =
      (index / (data.length - 1)) *
      width;

    const y =
      height -
      ((item.value - min) /
      (max - min)) *
      height;

    if (index === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }

  });

  ctx.strokeStyle = "#111";
  ctx.lineWidth = 2;
  ctx.stroke();

}


/* =========================
   Stop Measurement
========================= */

async function stopMeasurement() {

  if (!isMeasuring) return;

  isMeasuring = false;

  if (measurementInterval) {

    clearInterval(
      measurementInterval
    );

    measurementInterval = null;

  }

  if (timerInterval) {

    clearInterval(
      timerInterval
    );

    timerInterval = null;

  }

  if (motionHandler) {

    window.removeEventListener(
      "devicemotion",
      motionHandler
    );

    motionHandler = null;

  }

  if (audioContext) {

    try {
      await audioContext.close();
    } catch (error) {
      console.warn(error);
    }

    audioContext = null;
  }

  await releaseWakeLock();

  document.getElementById(
    "startButton"
  ).disabled = false;

  document.getElementById(
    "stopButton"
  ).disabled = true;

  document.getElementById(
    "sensorStatus"
  ).textContent =
    "測定終了";

  document.getElementById(
    "sensorStatus"
  ).className =
    "status";

  const result =
    calculateResult();

  renderResult(result);

  measurements.push(result);

  await saveResultToFirestore(
    result
  );

  updateStreak(result);

  renderDashboard();

}


/* =========================
   Result
========================= */

function calculateResult() {

  const duration =
    measurementStartTime
      ? Math.floor(
          (Date.now() -
            measurementStartTime) /
          1000
        )
      : 0;

  const estimatedSleepSeconds =
    (stillCount + smallCount) *
    10;

  const sleepHours =
    estimatedSleepSeconds / 3600;

  let score = 0;

  /*
     中高生の目安として8～10時間に
     近いほど評価する。
  */

  if (
    sleepHours >= 8 &&
    sleepHours <= 10
  ) {

    score += 60;

  } else if (
    sleepHours >= 7 &&
    sleepHours < 8
  ) {

    score += 45;

  } else if (
    sleepHours > 10 &&
    sleepHours <= 11
  ) {

    score += 50;

  } else {

    score += 30;

  }

  const total =
    stillCount +
    smallCount +
    largeCount;

  const movementRate =
    total > 0
      ? largeCount / total
      : 0;

  if (movementRate < 0.1) {
    score += 30;
  } else if (movementRate < 0.2) {
    score += 20;
  } else {
    score += 10;
  }

  const averageVolume =
    measurementData.length > 0
      ? measurementData.reduce(
          (sum, item) =>
            sum + item.volume,
          0
        ) / measurementData.length
      : 0;

  if (averageVolume < 0.05) {
    score += 10;
  } else if (averageVolume < 0.1) {
    score += 5;
  }

  score =
    Math.max(
      0,
      Math.min(100, Math.round(score))
    );

  return {
    date: todayString(),
    timestamp: new Date().toISOString(),
    durationSeconds: duration,
    estimatedSleepSeconds:
      estimatedSleepSeconds,
    sleepHours:
      Number(sleepHours.toFixed(2)),
    score: score,
    stillCount: stillCount,
    smallCount: smallCount,
    largeCount: largeCount,
    averageVolume:
      Number(averageVolume.toFixed(4)),
    samples:
      measurementData
  };

}


function renderResult(result) {

  document.getElementById(
    "resultArea"
  ).innerHTML = `
    <p><strong>睡眠時間の推定：</strong>
      ${result.sleepHours}時間
    </p>

    <p><strong>睡眠スコア：</strong>
      ${result.score} / 100
    </p>

    <p><strong>測定時間：</strong>
      ${formatDuration(result.durationSeconds)}
    </p>

    <p><strong>静止：</strong>
      ${result.stillCount}回
    </p>

    <p><strong>小さな動き：</strong>
      ${result.smallCount}回
    </p>

    <p><strong>大きな動き：</strong>
      ${result.largeCount}回
    </p>
  `;

}


/* =========================
   Firestore
========================= */

async function saveResultToFirestore(result) {

  if (!currentUser) {
    console.warn(
      "Firebaseユーザーがありません"
    );
    return;
  }

  try {

    const measurementRef =
      doc(
        db,
        "users",
        currentUser.uid,
        "measurements",
        result.date
      );

    await setDoc(
      measurementRef,
      result
    );

    console.log(
      "測定結果をFirestoreへ保存しました"
    );

  } catch (error) {

    console.error(
      "Firestore保存エラー:",
      error
    );

  }

}


async function saveProfileToFirestore() {

  if (!currentUser) return;

  try {

    const profileRef =
      doc(
        db,
        "users",
        currentUser.uid
      );

    await setDoc(
      profileRef,
      profile,
      { merge: true }
    );

  } catch (error) {

    console.error(
      "プロフィール保存エラー:",
      error
    );

  }

}


async function loadFromFirestore() {

  if (!currentUser) return;

  try {

    const profileRef =
      doc(
        db,
        "users",
        currentUser.uid
      );

    const profileSnapshot =
      await getDoc(profileRef);

    if (profileSnapshot.exists()) {

      profile = {
        ...profile,
        ...profileSnapshot.data()
      };

    }

    const measurementsRef =
      collection(
        db,
        "users",
        currentUser.uid,
        "measurements"
      );

    const q =
      query(
        measurementsRef,
        orderBy("timestamp", "desc")
      );

    const snapshot =
      await getDocs(q);

    measurements = [];

    snapshot.forEach(
      item => {
        measurements.push(
          item.data()
        );
      }
    );

  } catch (error) {

    console.error(
      "Firestore読み込みエラー:",
      error
    );

  }

}


/* =========================
   Streak
========================= */

function updateStreak(result) {

  const date =
    result.date;

  if (
    profile.lastMeasurementDate === date
  ) {
    return;
  }

  const previous =
    profile.lastMeasurementDate;

  if (!previous) {

    profile.currentStreak = 1;

  } else {

    const previousDate =
      new Date(previous);

    const currentDate =
      new Date(date);

    const diff =
      Math.round(
        (
          currentDate -
          previousDate
        ) /
        (1000 * 60 * 60 * 24)
      );

    if (diff === 1) {

      profile.currentStreak++;

    } else {

      profile.currentStreak = 1;

    }

  }

  profile.bestStreak =
    Math.max(
      profile.bestStreak,
      profile.currentStreak
    );

  profile.totalDays++;

  profile.xp +=
    10 + Math.round(result.score / 10);

  profile.lastMeasurementDate =
    date;

  saveProfileToFirestore();

}


/* =========================
   Dashboard
========================= */

function renderDashboard() {

  document.getElementById(
    "currentStreak"
  ).textContent =
    `${profile.currentStreak}日`;

  document.getElementById(
    "bestStreak"
  ).textContent =
    `${profile.bestStreak}日`;

  document.getElementById(
    "totalDays"
  ).textContent =
    `${profile.totalDays}日`;

  document.getElementById(
    "xpValue"
  ).textContent =
    profile.xp;

  renderAchievements();

  renderHistory();

}


/* =========================
   Achievements
========================= */

function renderAchievements() {

  const area =
    document.getElementById(
      "achievements"
    );

  const achievements = [

    {
      name: "初測定",
      condition:
        profile.totalDays >= 1
    },

    {
      name: "3日連続",
      condition:
        profile.bestStreak >= 3
    },

    {
      name: "7日連続",
      condition:
        profile.bestStreak >= 7
    },

    {
      name: "30日連続",
      condition:
        profile.bestStreak >= 30
    },

    {
      name: "10回測定",
      condition:
        profile.totalDays >= 10
    }

  ];

  area.innerHTML =
    achievements.map(
      achievement => `
        <span class="badge">
          ${
            achievement.condition
              ? "✓ "
              : "🔒 "
          }
          ${achievement.name}
        </span>
      `
    ).join("");

}


/* =========================
   History
========================= */

function renderHistory() {

  const area =
    document.getElementById(
      "history"
    );

  if (measurements.length === 0) {

    area.innerHTML =
      "<p class='small'>測定履歴はありません。</p>";

    return;
  }

  area.innerHTML =
    measurements
      .slice()
      .sort(
        (a, b) =>
          String(b.timestamp)
            .localeCompare(
              String(a.timestamp)
            )
      )
      .map(
        item => `
          <div class="history-item">

            <strong>
              ${item.date || "日付不明"}
            </strong>

            <div>
              睡眠時間：
              ${item.sleepHours ?? 0}時間
            </div>

            <div>
              スコア：
              ${item.score ?? 0} / 100
            </div>

            <div class="small">
              測定時間：
              ${formatDuration(
                item.durationSeconds || 0
              )}
            </div>

          </div>
        `
      )
      .join("");

}


/* =========================
   CSV
========================= */

function exportCSV() {

  if (measurements.length === 0) {

    alert(
      "出力できる測定データがありません。"
    );

    return;
  }

  const header = [
    "date",
    "sleepHours",
    "score",
    "durationSeconds",
    "stillCount",
    "smallCount",
    "largeCount",
    "averageVolume"
  ];

  const rows =
    measurements.map(
      item => [
        item.date,
        item.sleepHours,
        item.score,
        item.durationSeconds,
        item.stillCount,
        item.smallCount,
        item.largeCount,
        item.averageVolume
      ]
    );

  const csv = [
    header,
    ...rows
  ]
    .map(
      row =>
        row.map(
          value =>
            `"${String(value ?? "")
              .replaceAll('"', '""')}"`
        ).join(",")
    )
    .join("\n");

  const blob =
    new Blob(
      ["\ufeff" + csv],
      {
        type: "text/csv;charset=utf-8;"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    `sleep-data-${todayString()}.csv`;

  a.click();

  URL.revokeObjectURL(url);

}


/* =========================
   Reset
========================= */

async function resetAllData() {

  if (
    !confirm(
      "本当に全データを削除しますか？"
    )
  ) {
    return;
  }

  if (!currentUser) {

    alert(
      "Firebase認証が完了していません。"
    );

    return;
  }

  try {

    const measurementsRef =
      collection(
        db,
        "users",
        currentUser.uid,
        "measurements"
      );

    const snapshot =
      await getDocs(
        measurementsRef
      );

    for (
      const item of snapshot.docs
    ) {

      await deleteDoc(item.ref);

    }

    profile = {
      xp: 0,
      currentStreak: 0,
      bestStreak: 0,
      totalDays: 0,
      lastMeasurementDate: null
    };

    measurements = [];

    await saveProfileToFirestore();

    renderDashboard();

    document.getElementById(
      "resultArea"
    ).textContent =
      "データをリセットしました。";

  } catch (error) {

    console.error(
      "リセットエラー:",
      error
    );

    alert(
      "データのリセットに失敗しました。"
    );

  }

}
