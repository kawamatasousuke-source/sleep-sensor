<script type="module">

/* =========================================================
   Firebase SDK
========================================================= */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  getDocs,
  deleteDoc,
  query,
  orderBy
} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
  getAuth,
  signInAnonymously
} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/* =========================================================
   Firebase設定
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyBhfOVk4K5Ybjji16b1ZKRqXd1UJGypH9Y",
  authDomain: "sleep-sensor-af01f.firebaseapp.com",
  projectId: "sleep-sensor-af01f",
  storageBucket: "sleep-sensor-af01f.firebasestorage.app",
  messagingSenderId: "86707291255",
  appId: "1:86707291255:web:01e2e67fa63c3513503272"
};


/* =========================================================
   Firebase初期化
========================================================= */

const firebaseApp =
  initializeApp(firebaseConfig);

const db =
  getFirestore(firebaseApp);

const auth =
  getAuth(firebaseApp);

let currentUser = null;


/* =========================================================
   LocalStorage
========================================================= */

const STORAGE_KEY =
  "sleepSensorV9";

const OLD_STORAGE_KEY =
  "sleepSensorV8";

const defaultSaveData = {
  xp: 0,
  achievements: [],
  history: []
};


function loadLocalData() {

  try {

    const current =
      localStorage.getItem(STORAGE_KEY);

    if (current) {

      const data =
        JSON.parse(current);

      return {
        ...defaultSaveData,
        ...data
      };
    }

    const old =
      localStorage.getItem(OLD_STORAGE_KEY);

    if (old) {

      const data =
        JSON.parse(old);

      return {
        ...defaultSaveData,
        ...data
      };
    }

  } catch (error) {

    console.error(
      "LocalStorage読み込みエラー",
      error
    );
  }

  return {
    ...defaultSaveData
  };
}


let saveData =
  loadLocalData();


function saveLocalData() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(saveData)
  );
}


/* =========================================================
   測定データ
========================================================= */

let rawData = [];

let summaryData = [];

let currentInterval = [];

let measurementStartTime = null;

let measurementTimer = null;

let isMeasuring = false;

let lastMotion = null;

let movementHistory = [];

let volumeHistory = [];

let soundEvents = 0;

let lastSoundEventTime = 0;


/* =========================================================
   Wake Lock
   画面自動消灯防止
========================================================= */

let wakeLock = null;


async function requestWakeLock() {

  if (!("wakeLock" in navigator)) {

    console.log(
      "Wake Lock APIはこの端末・ブラウザでは利用できません"
    );

    return;
  }


  try {

    wakeLock =
      await navigator.wakeLock.request(
        "screen"
      );

    console.log(
      "画面自動消灯防止：ON"
    );


    wakeLock.addEventListener(
      "release",
      () => {

        console.log(
          "画面自動消灯防止：OFF"
        );

      }
    );

  } catch (error) {

    console.warn(
      "Wake Lock取得失敗:",
      error
    );
  }
}


async function releaseWakeLock() {

  if (!wakeLock) {
    return;
  }


  try {

    await wakeLock.release();

  } catch (error) {

    console.warn(
      "Wake Lock解除エラー:",
      error
    );
  }


  wakeLock = null;
}


/*
   ページが再び表示されたとき、
   測定中ならWake Lockを再取得する
*/

document.addEventListener(
  "visibilitychange",
  async () => {

    if (
      document.visibilityState ===
      "visible" &&
      isMeasuring
    ) {

      await requestWakeLock();

    }

  }
);


/* =========================================================
   DOM
========================================================= */

const firebaseStatus =
  document.getElementById("firebaseStatus");

const sensorStatus =
  document.getElementById("sensorStatus");

const micStatus =
  document.getElementById("micStatus");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

const measureTime =
  document.getElementById("measureTime");

const currentMovement =
  document.getElementById("currentMovement");

const currentVolume =
  document.getElementById("currentVolume");

const soundEventsElement =
  document.getElementById("soundEvents");

const resultArea =
  document.getElementById("resultArea");

const achievementsArea =
  document.getElementById("achievementsArea");

const historyArea =
  document.getElementById("historyArea");

const xpElement =

const canvas =

const ctx =

/* =========================================================
   Firebase状態表示
========================================================= */

function setFirebaseStatus(
  message,
  type = ""
) {

  firebaseStatus.textContent =
    message;

  firebaseStatus.className =
    "status " + type;
}


/* =========================================================
   Firebase匿名認証
========================================================= */

async function initializeAuthentication() {

  try {

    setFirebaseStatus(
      "Firebase匿名認証中..."
    );

    await signInAnonymously(auth);

    currentUser =
      auth.currentUser;

    if (!currentUser) {

      throw new Error(
        "Firebaseユーザーを取得できませんでした"
      );
    }

    console.log(
      "Firebase認証成功"
    );

    console.log(
      "UID:",
      currentUser.uid
    );

    setFirebaseStatus(
      "Firebase認証済み",
      "ok"
    );

    await loadFromFirestore();

    renderDashboard();

  } catch (error) {

    console.error(
      "Firebase認証エラー:",
      error
    );

    setFirebaseStatus(
      "Firebase認証エラー: " +
      error.message,
      "error"
    );
  }
}


/* =========================================================
   Firestore
   users/{uid}/measurements/{date}
========================================================= */

async function saveResultToFirestore(
  result
) {

  if (!currentUser) {

    console.warn(
      "Firebaseユーザー未認証"
    );

    return;
  }

  try {

    const resultRef =
      doc(
        db,
        "users",
        currentUser.uid,
        "measurements",
        result.date
      );

    await setDoc(
      resultRef,
      result,
      {
        merge: true
      }
    );

    console.log(
      "測定結果をFirestoreに保存しました"
    );

  } catch (error) {

    console.error(
      "測定結果保存エラー:",
      error
    );
  }
}


/* =========================================================
   プロフィール保存
========================================================= */

async function saveProfileToFirestore() {

  if (!currentUser) {
    return;
  }

  try {

    const profileRef =
      doc(
        db,
        "users",
        currentUser.uid
      );

    await setDoc(
      profileRef,
      {
        xp: saveData.xp,

        achievements:
          saveData.achievements,

        updatedAt:
          new Date().toISOString()
      },
      {
        merge: true
      }
    );

  } catch (error) {

    console.error(
      "プロフィール保存エラー:",
      error
    );
  }
}


/* =========================================================
   Firestore読み込み
========================================================= */

async function loadFromFirestore() {

  if (!currentUser) {
    return;
  }

  try {

    const uid =
      currentUser.uid;


    /* プロフィール */

    const profileRef =
      doc(
        db,
        "users",
        uid
      );

    const profileSnap =
      await getDoc(profileRef);

    if (profileSnap.exists()) {

      const profile =
        profileSnap.data();

      if (
        typeof profile.xp ===
        "number"
      ) {

        saveData.xp =
          profile.xp;
      }

      if (
        Array.isArray(
          profile.achievements
        )
      ) {

        saveData.achievements =
          profile.achievements;
      }
    }


    /* 測定履歴 */

    const measurementsRef =
      collection(
        db,
        "users",
        uid,
        "measurements"
      );

    const q =
      query(
        measurementsRef,
        orderBy(
          "date",
          "desc"
        )
      );

    const snapshot =
      await getDocs(q);

    const cloudHistory =
      [];

    snapshot.forEach(
      (document) => {

        cloudHistory.push(
          document.data()
        );
      }
    );


    if (
      cloudHistory.length > 0
    ) {

      saveData.history =
        cloudHistory;

    } else if (
      saveData.history.length > 0
    ) {

      console.log(
        "ローカル履歴をFirestoreへ移行します"
      );

      for (
        const result
        of saveData.history
      ) {

        await saveResultToFirestore(
          result
        );
      }

      await saveProfileToFirestore();
    }


    saveLocalData();

    console.log(
      "Firestore読み込み完了"
    );

  } catch (error) {

    console.error(
      "Firestore読み込みエラー:",
      error
    );

    setFirebaseStatus(
      "Firebaseは使用できますが、データ読み込みに失敗しました",
      "warn"
    );
  }
}


/* =========================================================
   加速度センサー
========================================================= */

function handleMotion(event) {

  if (!isMeasuring) {
    return;
  }

  const acceleration =
    event.accelerationIncludingGravity;

  if (!acceleration) {
    return;
  }

  const x =
    acceleration.x || 0;

  const y =
    acceleration.y || 0;

  const z =
    acceleration.z || 0;

  if (!lastMotion) {

    lastMotion = {
      x,
      y,
      z
    };

    return;
  }

  const dx =
    x - lastMotion.x;

  const dy =
    y - lastMotion.y;

  const dz =
    z - lastMotion.z;

  const movement =
    Math.sqrt(
      dx * dx +
      dy * dy +
      dz * dz
    );

  lastMotion = {
    x,
    y,
    z
  };

  movementHistory.push(
    movement
  );

  if (
    movementHistory.length > 3
  ) {

    movementHistory.shift();
  }

  const smoothedMovement =
    movementHistory.reduce(
      (a, b) => a + b,
      0
    ) /
    movementHistory.length;

  currentMovement.textContent =
    smoothedMovement.toFixed(2);

  currentInterval.push({

    time:
      new Date().toISOString(),

    movement:
      smoothedMovement

  });

  drawChart();
}


/* =========================================================
   マイク
========================================================= */

let audioContext = null;

let analyser = null;

let microphoneSource = null;

let microphoneStream = null;

let microphoneAnimation = null;


async function setupMicrophone() {

  try {

    microphoneStream =
      await navigator.mediaDevices.getUserMedia(
        {
          audio: true
        }
      );

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    analyser =
      audioContext.createAnalyser();

    analyser.fftSize =
      1024;

    microphoneSource =
      audioContext.createMediaStreamSource(
        microphoneStream
      );

    microphoneSource.connect(
      analyser
    );

    micStatus.textContent =
      "マイク接続済み";

    micStatus.className =
      "status ok";

    monitorMicrophone();

  } catch (error) {

    console.error(
      "マイクエラー:",
      error
    );

    micStatus.textContent =
      "マイクを使用できません";

    micStatus.className =
      "status warn";
  }
}


function monitorMicrophone() {

  if (!analyser) {
    return;
  }

  const buffer =
    new Uint8Array(
      analyser.fftSize
    );

  function loop() {

    if (!isMeasuring) {
      return;
    }

    analyser.getByteTimeDomainData(
      buffer
    );

    let sum = 0;

    let peak = 0;

    for (
      let i = 0;
      i < buffer.length;
      i++
    ) {

      const value =
        (buffer[i] - 128) /
        128;

      sum +=
        value * value;

      peak =
        Math.max(
          peak,
          Math.abs(value)
        );
    }

    const rms =
      Math.sqrt(
        sum / buffer.length
      );

    const volume =
      rms * 100;

    currentVolume.textContent =
      volume.toFixed(2);

    const now =
      Date.now();

    if (
      volume >= 3 &&
      now - lastSoundEventTime >
      3000
    ) {

      soundEvents++;

      lastSoundEventTime =
        now;

      soundEventsElement.textContent =
        soundEvents;
    }

    currentInterval.push({

      time:
        new Date().toISOString(),

      volume,

      peak

    });

    microphoneAnimation =
      requestAnimationFrame(
        loop
      );
  }

  loop();
}


/* =========================================================
   10秒集計
========================================================= */

let lastSummaryTime = 0;


function summarize10Seconds() {

  const now =
    Date.now();

  if (
    now - lastSummaryTime <
    10000
  ) {

    return;
  }

  if (
    currentInterval.length === 0
  ) {

    return;
  }

  lastSummaryTime =
    now;

  const movementValues =
    currentInterval
      .map(
        item =>
          item.movement
      )
      .filter(
        value =>
          typeof value ===
          "number"
      );

  const volumeValues =
    currentInterval
      .map(
        item =>
          item.volume
      )
      .filter(
        value =>
          typeof value ===
          "number"
      );

  const averageMovement =
    movementValues.length
      ? movementValues.reduce(
          (a, b) => a + b,
          0
        ) /
        movementValues.length
      : 0;

  const maxMovement =
    movementValues.length
      ? Math.max(
          ...movementValues
        )
      : 0;

  const averageVolume =
    volumeValues.length
      ? volumeValues.reduce(
          (a, b) => a + b,
          0
        ) /
        volumeValues.length
      : 0;

  let stillCount = 0;

  let smallCount = 0;

  let largeCount = 0;

  for (
    const value
    of movementValues
  ) {

    if (value < 0.10) {

      stillCount++;

    } else if (
      value < 0.60
    ) {

      smallCount++;

    } else {

      largeCount++;
    }
  }

  const summary = {

    timestamp:
      new Date().toISOString(),

    averageMovement,

    maxMovement,

    averageVolume,

    stillCount,

    smallCount,

    largeCount

  };

  summaryData.push(
    summary
  );

  currentInterval = [];
}


/* =========================================================
   グラフ
========================================================= */

function drawChart() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  if (
    movementHistory.length === 0
  ) {

    return;
  }

  const data =
    movementHistory;

  const max =
    Math.max(
      1,
      ...data
    );

  ctx.beginPath();

  data.forEach(
    (value, index) => {

      const x =
        (
          index /
          Math.max(
            1,
            data.length - 1
          )
        ) *
        canvas.width;

      const y =
        canvas.height -
        (
          value /
          max
        ) *
        (
          canvas.height -
          20
        );

      if (index === 0) {

        ctx.moveTo(
          x,
          y
        );

      } else {

        ctx.lineTo(
          x,
          y
        );
      }
    }
  );

  ctx.stroke();
}


/* =========================================================
   測定開始
========================================================= */

async function startMeasurement() {

  if (isMeasuring) {
    return;
  }

  /*
     画面自動消灯防止を開始
  */

  await requestWakeLock();


  rawData = [];

  summaryData = [];

  currentInterval = [];

  movementHistory = [];

  volumeHistory = [];

  soundEvents = 0;

  lastSoundEventTime = 0;

  lastSummaryTime = 0;

  lastMotion = null;

  measurementStartTime =
    Date.now();

  isMeasuring = true;

  startButton.disabled =
    true;

  stopButton.disabled =
    false;

  sensorStatus.textContent =
    "センサー測定中";

  sensorStatus.className =
    "status ok";

  soundEventsElement.textContent =
    "0";


  if (
    typeof DeviceMotionEvent !==
    "undefined" &&
    typeof DeviceMotionEvent.requestPermission ===
    "function"
  ) {

    try {

      const permission =
        await DeviceMotionEvent.requestPermission();

      if (
        permission !== "granted"
      ) {

        throw new Error(
          "モーションセンサーの許可が必要です"
        );
      }

    } catch (error) {

      console.error(
        error
      );

      sensorStatus.textContent =
        "センサーの許可が必要です";

      sensorStatus.className =
        "status warn";
    }
  }


  window.addEventListener(
    "devicemotion",
    handleMotion
  );


  await setupMicrophone();


  measurementTimer =
    setInterval(
      () => {

        const elapsed =
          Math.floor(
            (
              Date.now() -
              measurementStartTime
            ) / 1000
          );

        measureTime.textContent =
          elapsed + "秒";

        const latestMovement =
          movementHistory.length
            ? movementHistory[
                movementHistory.length - 1
              ]
            : 0;

        const latestVolume =
          parseFloat(
            currentVolume.textContent
          ) || 0;

        rawData.push({

          timestamp:
            new Date().toISOString(),

          elapsed,

          movement:
            latestMovement,

          volume:
            latestVolume

        });

        summarize10Seconds();

        drawChart();

      },
      1000
    );
}


/* =========================================================
   測定停止
========================================================= */

async function stopMeasurement() {

  if (!isMeasuring) {
    return;
  }

  isMeasuring = false;

  clearInterval(
    measurementTimer
  );

  measurementTimer =
    null;

  if (
    microphoneAnimation
  ) {

    cancelAnimationFrame(
      microphoneAnimation
    );

    microphoneAnimation =
      null;
  }

  if (
    microphoneStream
  ) {

    microphoneStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );
  }

  if (audioContext) {

    try {

      await audioContext.close();

    } catch {}

  }

  audioContext =
    null;

  analyser =
    null;

  microphoneSource =
    null;

  microphoneStream =
    null;

  window.removeEventListener(
    "devicemotion",
    handleMotion
  );


  /*
     画面自動消灯防止を解除
  */

  await releaseWakeLock();


  startButton.disabled =
    false;

  stopButton.disabled =
    true;

  sensorStatus.textContent =
    "測定停止";

  sensorStatus.className =
    "status";

  calculateResult();
}


/* =========================================================
   結果計算
========================================================= */

function calculateResult() {

  const elapsedSeconds =
    measurementStartTime
      ? Math.max(
          0,
          Math.floor(
            (
              Date.now() -
              measurementStartTime
            ) / 1000
          )
        )
      : 0;

  if (
    elapsedSeconds <= 0
  ) {

    return;
  }


  summarize10Seconds();


  let stillCount = 0;

  let smallCount = 0;

  let largeCount = 0;


  for (
    const item
    of summaryData
  ) {

    stillCount +=
      item.stillCount || 0;

    smallCount +=
      item.smallCount || 0;

    largeCount +=
      item.largeCount || 0;
  }


  const totalMovementCount =
    stillCount +
    smallCount +
    largeCount;


  const stillRatio =
    totalMovementCount > 0
      ? stillCount /
        totalMovementCount
      : 0;


  const largeRatio =
    totalMovementCount > 0
      ? largeCount /
        totalMovementCount
      : 0;


  const sleepSeconds =
    (
      stillCount +
      smallCount
    ) * 10;


  const estimatedSleepSeconds =
    Math.min(
      sleepSeconds,
      elapsedSeconds
    );


  const hours =
    estimatedSleepSeconds /
    3600;


  /* 睡眠時間スコア */

  let durationScore = 100;


  if (hours < 8) {

    durationScore =
      100 -
      (8 - hours) * 25;

  } else if (
    hours > 10
  ) {

    durationScore =
      100 -
      (hours - 10) * 10;
  }


  durationScore =
    Math.max(
      70,
      Math.min(
        100,
        durationScore
      )
    );


  /* 動きスコア */

  let movementScore =
    stillRatio * 100;


  movementScore =
    movementScore -
    largeRatio * 40;


  movementScore =
    Math.max(
      0,
      Math.min(
        100,
        movementScore
      )
    );


  /* 音スコア */

  const soundEventsPerHour =
    hours > 0
      ? soundEvents / hours
      : soundEvents;


  let soundScore =
    100 -
    soundEventsPerHour * 10;


  soundScore =
    Math.max(
      0,
      Math.min(
        100,
        soundScore
      )
    );


  /* 総合スコア */

  const overallScore =
    Math.round(
      durationScore * 0.45 +
      movementScore * 0.35 +
      soundScore * 0.20
    );


  /* 評価 */

  let evaluation = "";


  if (
    overallScore >= 90
  ) {

    evaluation =
      "とても良い";

  } else if (
    overallScore >= 75
  ) {

    evaluation =
      "良い";

  } else if (
    overallScore >= 60
  ) {

    evaluation =
      "普通";

  } else if (
    overallScore >= 40
  ) {

    evaluation =
      "改善の余地あり";

  } else {

    evaluation =
      "要改善";
  }


  const result = {

    date:
      new Date()
        .toISOString()
        .slice(
          0,
          10
        ),

    timestamp:
      new Date().toISOString(),

    elapsedSeconds,

    sleepSeconds:
      estimatedSleepSeconds,

    hours,

    durationScore:
      Math.round(
        durationScore
      ),

    movementScore:
      Math.round(
        movementScore
      ),

    soundScore:
      Math.round(
        soundScore
      ),

    score:
      overallScore,

    evaluation,

    stillRatio,

    largeRatio,

    soundEvents,

    soundEventsPerHour,

    rawCount:
      rawData.length,

    summaryCount:
      summaryData.length
  };


  addHistory(
    result
  );


  checkAchievements(
    result
  );


  saveLocalData();


  saveResultToFirestore(
    result
  );


  saveProfileToFirestore();


  renderResult(
    result
  );


  renderDashboard();
}


/* =========================================================
   履歴
========================================================= */

function addHistory(result) {

  const existingIndex =
    saveData.history.findIndex(
      item =>
        item.date ===
        result.date
    );


  if (
    existingIndex >= 0
  ) {

    saveData.history[
      existingIndex
    ] = result;

  } else {

    saveData.history.push(
      result
    );
  }


  saveData.history.sort(
    (a, b) =>
      b.date.localeCompare(
        a.date
      )
  );
}

/* =========================================================
   ストリーク
========================================================= */

function calculateStreak() {

  if (
    saveData.history.length === 0
  ) {

    return 0;
  }


  const dates =
    saveData.history
      .map(
        item =>
          item.date
      )
      .sort(
        (a, b) =>
          b.localeCompare(a)
      );


  const uniqueDates =
    [
      ...new Set(dates)
    ];


  if (
    uniqueDates.length === 0
  ) {

    return 0;
  }


  let streak = 1;


  for (
    let i = 1;
    i < uniqueDates.length;
    i++
  ) {

    const current =
      new Date(
        uniqueDates[i - 1]
      );


    const previous =
      new Date(
        uniqueDates[i]
      );


    const difference =
      Math.round(
        (
          current -
          previous
        ) /
        86400000
      );


    if (
      difference === 1
    ) {

      streak++;

    } else {

      break;
    }
  }


  return streak;
}

/* =========================================================
   時間フォーマット
========================================================= */

function formatTime(seconds) {

  seconds =
    Math.max(
      0,
      Math.floor(
        seconds || 0
      )
    );


  const hours =
    Math.floor(
      seconds / 3600
    );


  const minutes =
    Math.floor(
      (
        seconds % 3600
      ) / 60
    );


  const sec =
    seconds % 60;


  if (
    hours > 0
  ) {

    return (
      hours +
      "時間 " +
      minutes +
      "分"
    );
  }


  if (
    minutes > 0
  ) {

    return (
      minutes +
      "分 " +
      sec +
      "秒"
    );
  }


  return (
    sec +
    "秒"
  );
}


/* =========================================================
   CSV
========================================================= */

function downloadCSV(
  data,
  filename
) {

  if (
    !data ||
    data.length === 0
  ) {

    alert(
      "出力できるデータがありません"
    );

    return;
  }


  const headers =
    Object.keys(
      data[0]
    );


  const rows = [

    headers,

    ...data.map(
      row =>
        headers.map(
          header =>
            row[header] ?? ""
        )
    )

  ];


  const csv =
    rows
      .map(
        row =>
          row
            .map(
              value =>
                `"${String(value)
                  .replace(
                    /"/g,
                    '""'
                  )}"`
            )
            .join(",")
      )
      .join("\n");


  const blob =
    new Blob(
      [
        "\uFEFF" +
        csv
      ],
      {
        type:
          "text/csv;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;

  a.download =
    filename;


  document.body.appendChild(
    a
  );


  a.click();

  a.remove();


  URL.revokeObjectURL(
    url
  );
}
