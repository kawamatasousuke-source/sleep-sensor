<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>睡眠センサー実験 v5</title>

  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 24px;
    }

    h2 {
      margin-top: 30px;
    }

    .box {
      background: #222;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .value {
      font-size: 28px;
      font-weight: bold;
      margin: 5px 0 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 5px 0;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #444;
      color: white;
    }

    button:active {
      background: #666;
    }

    canvas {
      width: 100%;
      background: #000;
      border-radius: 10px;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th, td {
      border: 1px solid #555;
      padding: 6px;
      text-align: center;
    }

    th {
      background: #333;
    }

    .result {
      font-size: 18px;
      line-height: 1.8;
    }

    .score {
      font-size: 42px;
      font-weight: bold;
      text-align: center;
      margin: 15px 0;
    }

    .state {
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>睡眠センサー実験 v5</h1>

  <div class="box">
    <div>状態</div>
    <div id="status">待機中</div>
  </div>

  <div class="box">
    <div>マイク</div>
    <div id="micStatus">未接続</div>
  </div>

  <div class="box">
    <div>加速度</div>
    <div id="motionStatus">未接続</div>
  </div>

  <div class="box">
    <div>画面消灯防止</div>
    <div id="wakeLockStatus">OFF</div>
  </div>

  <div class="box">
    <div>経過時間</div>
    <div class="value" id="elapsed">00:00:00</div>

    <div>現在の動き</div>
    <div class="value" id="movement">0.00</div>

    <div>現在の音量</div>
    <div class="value" id="volume">0</div>

    <div>記録数</div>
    <div class="value" id="recordCount">0</div>
  </div>

  <button id="startButton">センサーを使用する</button>
  <button id="stopButton">測定停止</button>

  <button id="saveRawButton">生データCSV保存</button>
  <button id="saveSummaryButton">10秒集計CSV保存</button>

  <h2>現在の睡眠状態（実験用）</h2>

  <div class="box">
    <div class="state" id="currentState">測定前</div>
  </div>

  <h2>睡眠結果</h2>

  <div class="box result">

    <div class="score" id="sleepScore">-- 点</div>

    <div>
      睡眠時間：
      <strong id="sleepDuration">--</strong>
    </div>

    <div>
      静止時間：
      <strong id="stillDuration">--</strong>
    </div>

    <div>
      小さな動き：
      <strong id="smallMovementCount">--</strong>
    </div>

    <div>
      大きな動き：
      <strong id="largeMovementCount">--</strong>
    </div>

    <div>
      音が発生した区間：
      <strong id="soundCount">--</strong>
    </div>

    <div>
      推定覚醒区間：
      <strong id="awakeCount">--</strong>
    </div>

    <div>
      総合評価：
      <strong id="sleepEvaluation">--</strong>
    </div>

  </div>

  <h2>睡眠状態グラフ</h2>

  <div class="box">
    <canvas id="graph" width="800" height="350"></canvas>
  </div>

  <h2>10秒ごとの測定結果</h2>

  <div class="box">
    <table>
      <thead>
        <tr>
          <th>開始</th>
          <th>終了</th>
          <th>平均動き</th>
          <th>最大動き</th>
          <th>平均音量</th>
          <th>最大音量</th>
          <th>状態</th>
        </tr>
      </thead>

      <tbody id="summaryTable">
      </tbody>
    </table>
  </div>


<script>

let measuring = false;

let startTime = 0;
let elapsedTimer = null;
let summaryTimer = null;

let rawData = [];
let summaryData = [];

let intervalData = [];

let latestMovement = 0;
let latestVolume = 0;

let audioContext = null;
let analyser = null;
let microphoneSource = null;
let microphoneStream = null;

let micTimer = null;

let wakeLock = null;


// ================================
// HTML要素
// ================================

const statusEl = document.getElementById("status");
const micStatusEl = document.getElementById("micStatus");
const motionStatusEl = document.getElementById("motionStatus");
const wakeLockStatusEl = document.getElementById("wakeLockStatus");

const elapsedEl = document.getElementById("elapsed");
const movementEl = document.getElementById("movement");
const volumeEl = document.getElementById("volume");
const recordCountEl = document.getElementById("recordCount");

const currentStateEl = document.getElementById("currentState");

const summaryTable = document.getElementById("summaryTable");

const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");


// ================================
// 画面消灯防止
// ================================

async function requestWakeLock() {

  if (!("wakeLock" in navigator)) {
    wakeLockStatusEl.textContent = "非対応";
    return;
  }

  try {

    wakeLock = await navigator.wakeLock.request("screen");

    wakeLockStatusEl.textContent = "ON";

    wakeLock.addEventListener("release", () => {
      wakeLockStatusEl.textContent = "OFF";
    });

  } catch (error) {

    console.error("Wake Lock取得失敗:", error);

    wakeLockStatusEl.textContent = "取得失敗";
  }
}


async function releaseWakeLock() {

  if (!wakeLock) return;

  try {
    await wakeLock.release();
  } catch (error) {
    console.error(error);
  }

  wakeLock = null;

  wakeLockStatusEl.textContent = "OFF";
}


document.addEventListener("visibilitychange", async () => {

  if (
    document.visibilityState === "visible" &&
    measuring
  ) {
    await requestWakeLock();
  }

});


// ================================
// マイク設定
// ================================

async function setupMicrophone(stream) {

  microphoneStream = stream;

  audioContext = new (window.AudioContext ||
                      window.webkitAudioContext)();

  if (audioContext.state === "suspended") {
    await audioContext.resume();
  }

  microphoneSource =
    audioContext.createMediaStreamSource(stream);

  analyser = audioContext.createAnalyser();

  analyser.fftSize = 2048;

  analyser.smoothingTimeConstant = 0;

  microphoneSource.connect(analyser);

  micStatusEl.textContent = "入力あり";

  startMicrophoneMeasurement();
}


// ================================
// マイク測定
// ================================

function startMicrophoneMeasurement() {

  const bufferLength = analyser.fftSize;

  const dataArray =
    new Float32Array(bufferLength);


  function measureMicrophone() {

    if (!measuring) return;

    analyser.getFloatTimeDomainData(dataArray);

    let sum = 0;

    let peak = 0;

    for (let i = 0; i < dataArray.length; i++) {

      const value = dataArray[i];

      sum += value * value;

      const abs = Math.abs(value);

      if (abs > peak) {
        peak = abs;
      }
    }


    // RMS
    const rms =
      Math.sqrt(sum / dataArray.length);


    /*
      マイク感度アップ

      元のRMSはかなり小さいため、
      そのままだと画面上で変化が分かりにくい。

      ここでは実験用に0～100へ拡大。
    */

    let volume =
      rms * 3000;


    /*
      突発的な音にも少し反応しやすくする
    */

    volume += peak * 1000;


    volume =
      Math.min(100, volume);


    latestVolume = volume;

    volumeEl.textContent =
      volume.toFixed(1);


    if (volume > 1) {
      micStatusEl.textContent = "音を検出";
    } else {
      micStatusEl.textContent = "入力あり";
    }


    // 50msごと
    micTimer = setTimeout(
      measureMicrophone,
      50
    );
  }


  measureMicrophone();
}


// ================================
// 加速度
// ================================

function handleMotion(event) {

  if (!measuring) return;


  const acc =
    event.accelerationIncludingGravity;


  if (!acc) return;


  const x = acc.x || 0;
  const y = acc.y || 0;
  const z = acc.z || 0;


  const magnitude =
    Math.sqrt(
      x * x +
      y * y +
      z * z
    );


  /*
    重力約9.8m/s²との差を
    「動き」として扱う。
  */

  const movement =
    Math.abs(
      magnitude - 9.80665
    );


  latestMovement = movement;


  movementEl.textContent =
    movement.toFixed(2);


  motionStatusEl.textContent =
    "測定中";


  const now =
    performance.now();


  const elapsed =
    (now - startTime) / 1000;


  const record = {

    time: elapsed,

    movement: movement,

    volume: latestVolume

  };


  rawData.push(record);

  intervalData.push(record);


  recordCountEl.textContent =
    rawData.length;


  drawGraph();
}


// ================================
// 状態判定
// ================================

function getSleepState(avgMovement, maxMovement) {

  if (
    avgMovement < 0.20 &&
    maxMovement < 0.80
  ) {

    return "静止";

  }


  if (
    avgMovement < 0.80 &&
    maxMovement < 2.00
  ) {

    return "小さな動き";

  }


  return "大きな動き";
}


// ================================
// 10秒集計
// ================================

function createSummary() {

  if (!measuring) return;

  if (intervalData.length === 0) return;


  const elapsed =
    (performance.now() - startTime) / 1000;


  const movements =
    intervalData.map(d => d.movement);

  const volumes =
    intervalData.map(d => d.volume);


  const avgMovement =
    movements.reduce(
      (a, b) => a + b,
      0
    ) / movements.length;


  const maxMovement =
    Math.max(...movements);


  const avgVolume =
    volumes.reduce(
      (a, b) => a + b,
      0
    ) / volumes.length;


  const maxVolume =
    Math.max(...volumes);


  const state =
    getSleepState(
      avgMovement,
      maxMovement
    );


  const summary = {

    start:
      Math.max(0, elapsed - 10),

    end:
      elapsed,

    avgMovement:
      avgMovement,

    maxMovement:
      maxMovement,

    avgVolume:
      avgVolume,

    maxVolume:
      maxVolume,

    state:
      state
  };


  summaryData.push(summary);


  addSummaryRow(summary);


  intervalData = [];

}


// ================================
// 表に追加
// ================================

function addSummaryRow(data) {

  const row =
    document.createElement("tr");


  row.innerHTML = `

    <td>
      ${formatSeconds(data.start)}
    </td>

    <td>
      ${formatSeconds(data.end)}
    </td>

    <td>
      ${data.avgMovement.toFixed(2)}
    </td>

    <td>
      ${data.maxMovement.toFixed(2)}
    </td>

    <td>
      ${data.avgVolume.toFixed(1)}
    </td>

    <td>
      ${data.maxVolume.toFixed(1)}
    </td>

    <td>
      ${data.state}
    </td>

  `;


  summaryTable.appendChild(row);
}


// ================================
// 経過時間
// ================================

function updateElapsed() {

  if (!measuring) return;


  const elapsed =
    (performance.now() - startTime) / 1000;


  elapsedEl.textContent =
    formatSeconds(elapsed);
}


function formatSeconds(seconds) {

  seconds =
    Math.floor(seconds);


  const h =
    Math.floor(seconds / 3600);


  const m =
    Math.floor(
      (seconds % 3600) / 60
    );


  const s =
    seconds % 60;


  return (
    String(h).padStart(2, "0") +
    ":" +
    String(m).padStart(2, "0") +
    ":" +
    String(s).padStart(2, "0")
  );
}


// ================================
// グラフ
// ================================

function drawGraph() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if (rawData.length < 2) return;


  const width =
    canvas.width;

  const height =
    canvas.height;


  const maxPoints = 300;

  const data =
    rawData.slice(-maxPoints);


  // 中央線

  ctx.beginPath();

  ctx.moveTo(
    0,
    height / 2
  );

  ctx.lineTo(
    width,
    height / 2
  );

  ctx.strokeStyle = "#555";

  ctx.stroke();


  // 動き

  ctx.beginPath();


  data.forEach((d, i) => {

    const x =
      i /
      (data.length - 1) *
      width;


    const normalized =
      Math.min(
        d.movement / 5,
        1
      );


    const y =
      height / 2 -
      normalized *
      (height / 2 - 10);


    if (i === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }

  });


  ctx.strokeStyle = "#00ff88";

  ctx.lineWidth = 2;

  ctx.stroke();


  // 音

  ctx.beginPath();


  data.forEach((d, i) => {

    const x =
      i /
      (data.length - 1) *
      width;


    const normalized =
      Math.min(
        d.volume / 100,
        1
      );


    const y =
      height -
      normalized *
      (height / 2 - 10);


    if (i === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }

  });


  ctx.strokeStyle = "#66aaff";

  ctx.stroke();

}


// ================================
// 睡眠結果計算
// ================================

function calculateSleepResult() {

  if (summaryData.length === 0) {

    alert(
      "10秒以上測定してから停止してください。"
    );

    return;
  }


  const totalSeconds =
    summaryData[
      summaryData.length - 1
    ].end;


  /*
    状態別集計
  */

  let stillCount = 0;

  let smallCount = 0;

  let largeCount = 0;

  let soundCount = 0;


  summaryData.forEach(data => {

    if (data.state === "静止") {
      stillCount++;
    }

    if (data.state === "小さな動き") {
      smallCount++;
    }

    if (data.state === "大きな動き") {
      largeCount++;
    }


    /*
      音量10以上を
      「音が発生した区間」とする
    */

    if (data.maxVolume >= 10) {
      soundCount++;
    }

  });


  /*
    静止時間
  */

  const stillSeconds =
    stillCount * 10;


  /*
    大きな動きの区間を
    覚醒の可能性がある区間として数える。

    あくまで実験用。
  */

  const awakeCount =
    largeCount;


  /*
    8～10時間を基準に睡眠時間を評価
  */

  const hours =
    totalSeconds / 3600;


  let durationScore;


  if (hours >= 8 && hours <= 10) {

    durationScore = 100;

  } else if (hours < 8) {

    durationScore =
      Math.max(
        0,
        100 - (8 - hours) * 25
      );

  } else {

    durationScore =
      Math.max(
        70,
        100 - (hours - 10) * 10
      );

  }


  /*
    動きの少なさ

    静止区間の割合
  */

  const stillRatio =
    stillCount /
    summaryData.length;


  const stillScore =
    stillRatio * 100;


  /*
    大きな動きが少ないほど高評価
  */

  const movementScore =
    Math.max(
      0,
      100 -
      (
        largeCount /
        summaryData.length
      ) * 100
    );


  /*
    音

    音が少ないほど高評価
  */

  const soundRatio =
    soundCount /
    summaryData.length;


  const soundScore =
    Math.max(
      0,
      100 -
      soundRatio * 100
    );


  /*
    総合スコア

    睡眠時間を一番重視
  */

  const score =
    Math.round(
      durationScore * 0.45 +
      stillScore * 0.25 +
      movementScore * 0.20 +
      soundScore * 0.10
    );


  let evaluation;


  if (score >= 90) {

    evaluation =
      "とても良好";

  } else if (score >= 75) {

    evaluation =
      "良好";

  } else if (score >= 60) {

    evaluation =
      "普通";

  } else if (score >= 40) {

    evaluation =
      "やや改善";

  } else {

    evaluation =
      "改善が必要";

  }


  /*
    結果表示
  */

  document.getElementById(
    "sleepScore"
  ).textContent =
    score + " 点";


  document.getElementById(
    "sleepDuration"
  ).textContent =
    formatSeconds(totalSeconds);


  document.getElementById(
    "stillDuration"
  ).textContent =
    formatSeconds(stillSeconds);


  document.getElementById(
    "smallMovementCount"
  ).textContent =
    smallCount + "区間";


  document.getElementById(
    "largeMovementCount"
  ).textContent =
    largeCount + "区間";


  document.getElementById(
    "soundCount"
  ).textContent =
    soundCount + "区間";


  document.getElementById(
    "awakeCount"
  ).textContent =
    awakeCount + "区間";


  document.getElementById(
    "sleepEvaluation"
  ).textContent =
    evaluation;


  currentStateEl.textContent =
    "測定終了";

}


// ================================
// 測定開始
// ================================

document.getElementById(
  "startButton"
).addEventListener(
  "click",
  async () => {

    if (measuring) return;


    try {

      statusEl.textContent =
        "センサー準備中";


      /*
        マイク許可
      */

      const stream =
        await navigator.mediaDevices
          .getUserMedia({

            audio: {

              echoCancellation: false,

              noiseSuppression: false,

              autoGainControl: false

            }

          });


      /*
        加速度センサー確認
      */

      if (
        typeof DeviceMotionEvent !==
        "undefined" &&
        typeof DeviceMotionEvent
          .requestPermission ===
          "function"
      ) {

        const permission =
          await DeviceMotionEvent
            .requestPermission();


        if (permission !== "granted") {

          alert(
            "加速度センサーの使用が許可されませんでした。"
          );

          return;
        }

      }


      /*
        初期化
      */

      rawData = [];

      summaryData = [];

      intervalData = [];

      summaryTable.innerHTML = "";


      measuring = true;

      startTime =
        performance.now();


      statusEl.textContent =
        "測定中";


      currentStateEl.textContent =
        "測定中";


      /*
        画面消灯防止
      */

      await requestWakeLock();


      /*
        マイク開始
      */

      await setupMicrophone(stream);


      /*
        加速度開始
      */

      window.addEventListener(
        "devicemotion",
        handleMotion
      );


      /*
        時間表示
      */

      elapsedTimer =
        setInterval(
          updateElapsed,
          100
        );


      /*
        10秒集計

        100msごとに確認して、
        経過時間が10秒を超えたら集計
      */

      summaryTimer =
        setInterval(() => {

          const elapsed =
            (
              performance.now() -
              startTime
            ) / 1000;


          if (
            elapsed >=
            (summaryData.length + 1) * 10
          ) {

            createSummary();

          }

        }, 100);


    } catch (error) {

      console.error(error);

      measuring = false;

      statusEl.textContent =
        "エラー";

      alert(
        "センサーを使用できませんでした。\n\n" +
        error.message
      );

    }

  }
);


// ================================
// 測定停止
// ================================

document.getElementById(
  "stopButton"
).addEventListener(
  "click",
  async () => {

    if (!measuring) return;


    measuring = false;


    window.removeEventListener(
      "devicemotion",
      handleMotion
    );


    if (elapsedTimer) {

      clearInterval(
        elapsedTimer
      );

      elapsedTimer = null;
    }


    if (summaryTimer) {

      clearInterval(
        summaryTimer
      );

      summaryTimer = null;
    }


    if (micTimer) {

      clearTimeout(
        micTimer
      );

      micTimer = null;
    }


    /*
      最後の10秒未満のデータも集計
    */

    if (intervalData.length > 0) {

      const elapsed =
        (
          performance.now() -
          startTime
        ) / 1000;


      const movements =
        intervalData.map(
          d => d.movement
        );


      const volumes =
        intervalData.map(
          d => d.volume
        );


      const avgMovement =
        movements.reduce(
          (a, b) => a + b,
          0
        ) /
        movements.length;


      const maxMovement =
        Math.max(...movements);


      const avgVolume =
        volumes.reduce(
          (a, b) => a + b,
          0
        ) /
        volumes.length;


      const maxVolume =
        Math.max(...volumes);


      const state =
        getSleepState(
          avgMovement,
          maxMovement
        );


      const summary = {

        start:
          Math.max(
            0,
            elapsed - 10
          ),

        end:
          elapsed,

        avgMovement,

        maxMovement,

        avgVolume,

        maxVolume,

        state

      };


      summaryData.push(summary);

      addSummaryRow(summary);

      intervalData = [];

    }


    /*
      マイク停止
    */

    if (microphoneStream) {

      microphoneStream
        .getTracks()
        .forEach(
          track => track.stop()
        );

      microphoneStream = null;
    }


    if (audioContext) {

      try {
        await audioContext.close();
      } catch (error) {
        console.error(error);
      }

      audioContext = null;
    }


    analyser = null;


    /*
      Wake Lock解除
    */

    await releaseWakeLock();


    statusEl.textContent =
      "測定終了";


    micStatusEl.textContent =
      "停止";


    motionStatusEl.textContent =
      "停止";


    /*
      睡眠結果計算
    */

    calculateSleepResult();

  }
);


// ================================
// 生データCSV
// ================================

document.getElementById(
  "saveRawButton"
).addEventListener(
  "click",
  () => {

    if (rawData.length === 0) {

      alert(
        "保存できるデータがありません。"
      );

      return;
    }


    let csv =
      "経過時間,動き,音量\n";


    rawData.forEach(data => {

      csv +=
        data.time.toFixed(2) +
        "," +
        data.movement.toFixed(4) +
        "," +
        data.volume.toFixed(2) +
        "\n";

    });


    downloadCSV(
      csv,
      "sleep_raw_data.csv"
    );

  }
);


// ================================
// 10秒集計CSV
// ================================

document.getElementById(
  "saveSummaryButton"
).addEventListener(
  "click",
  () => {

    if (summaryData.length === 0) {

      alert(
        "保存できる集計データがありません。"
      );

      return;
    }


    let csv =
      "開始時間,終了時間,平均動き,最大動き,平均音量,最大音量,状態\n";


    summaryData.forEach(data => {

      csv +=
        data.start.toFixed(1) +
        "," +
        data.end.toFixed(1) +
        "," +
        data.avgMovement.toFixed(4) +
        "," +
        data.maxMovement.toFixed(4) +
        "," +
        data.avgVolume.toFixed(2) +
        "," +
        data.maxVolume.toFixed(2) +
        "," +
        data.state +
        "\n";

    });


    downloadCSV(
      csv,
      "sleep_summary_data.csv"
    );

  }
);


// ================================
// CSVダウンロード
// ================================

function downloadCSV(csv, filename) {

  const blob =
    new Blob(
      ["\uFEFF" + csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download = filename;

  a.click();


  URL.revokeObjectURL(url);
}


</script>
